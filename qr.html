<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teiul Verde: QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #e9ebe5; }

  .card {
    width: 105mm;
    min-height: 148mm;
    margin: 24px auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    text-align: center;
  }
  .card-body { flex: 1; padding: 22px 26px; display: flex; flex-direction: column; align-items: center; }
  .card h1 { font-size: 34px; }
  .card .tagline { margin-bottom: 18px; }
  .card img { width: 62mm; height: 62mm; }
  .scan { margin: 16px 0 0; font-size: 18px; line-height: 1.35; }
  .scan span { display: block; color: var(--muted); font-size: 15px; }
  .url { margin-top: auto; padding-top: 14px; font-size: 13px; color: var(--muted); }

  .print { display: block; margin: 0 auto 32px; font: inherit; font-weight: 500; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }

  @page { size: A6; margin: 0; }
  @media print {
    body { background: #fff; }
    .card { margin: 0; width: 105mm; height: 148mm; }
    .print { display: none; }
    .stripe { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="stripe" aria-hidden="true"></div>
  <div class="card-body">
    <h1>Teiul Verde</h1>
    <p class="tagline">Bucătărie moldovenească de casă</p>
    <img src="qr.svg" alt="QR: dancchik.github.io/menu-demo">
    <p class="scan">
      Scanați pentru meniu
      <span>Отсканируйте, чтобы открыть меню</span>
      <span>Scan to see the menu</span>
    </p>
    <p class="url">dancchik.github.io/menu-demo</p>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</div>

<button class="print" type="button" onclick="print()">Imprimă / Печать</button>

</body>
</html>
